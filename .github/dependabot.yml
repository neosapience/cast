version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
