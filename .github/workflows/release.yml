name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Normalize and publish Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ruby scripts/normalize_homebrew_formula.rb --self-test
          ruby scripts/normalize_homebrew_formula.rb dist/homebrew/cast.rb
          formula_sha=$(gh api repos/neosapience/homebrew-tap/contents/cast.rb --jq .sha)
          gh api --method PUT repos/neosapience/homebrew-tap/contents/cast.rb \
            -f branch=main -f sha="$formula_sha" \
            -f message="Brew formula update for cast $RELEASE_TAG" \
            -f content="$(base64 -w 0 dist/homebrew/cast.rb)" --silent
