version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: cast
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: cast
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

homebrew_casks:
  - name: cast
    ids:
      - cast
    binaries:
      - cast
    repository:
      owner: neosapience
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/cast"]
          end
    homepage: https://github.com/neosapience/cast
    description: Typecast Text-to-Speech CLI

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
